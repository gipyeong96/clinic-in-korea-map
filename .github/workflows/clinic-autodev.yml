name: Clinic map approved autodev
run-name: Clinic autodev / task-file

on:
  schedule:
    - cron: '0 0 * * 1-5' # Weekdays 09:00 Asia/Seoul; GitHub scheduling can be delayed.
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Validate task-file migration without paid AI execution'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clinic-map-approved-autodev
  cancel-in-progress: false

jobs:
  gate:
    name: Check approval and previous attempts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      task_id: ${{ steps.gate.outputs.task_id }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      task_digest: ${{ steps.gate.outputs.task_digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify task list and duplicate gates
        run: |
          node --test .github/scripts/autodev-gate.test.cjs
          node -e "require('./.github/scripts/autodev-task.cjs').approvedTask(require('./.github/autodev/tasks.json'))"
      - uses: actions/github-script@v8
        id: gate
        env:
          AUTODEV_VERIFY_ONLY: ${{ inputs.verify_only }}
          AUTODEV_ENABLED: ${{ vars.CLINIC_MAP_AUTODEV_ENABLED }}
          # A presence boolean only; the gate does not receive the API key.
          AUTODEV_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        with:
          script: |
            const gate = require('./.github/scripts/autodev-gate.cjs');
            const fs = require('node:fs');
            const {approvedTask} = require('./.github/scripts/autodev-task.cjs');
            const env = {...process.env};
            if (env.AUTODEV_ENABLED === 'true' && env.AUTODEV_KEY_PRESENT === 'true') {
              const task = approvedTask(JSON.parse(fs.readFileSync('.github/autodev/tasks.json', 'utf8')));
              env.AUTODEV_TASK = task?.instructions || '';
              env.AUTODEV_TASK_ID = task?.id || '';
            }
            await gate({github, context, core, env});
            // Uploaded before development; failure to save the claim prevents development.
            fs.writeFileSync(process.env.RUNNER_TEMP + '/autodev-claim.json', JSON.stringify({task: env.AUTODEV_TASK_ID || '', run: context.runId}));
      - name: Record attempt claim before development
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autodev-claim-${{ steps.gate.outputs.task_id }}
          path: ${{ runner.temp }}/autodev-claim.json
          retention-days: 90
          if-no-files-found: error

  develop:
    name: Develop approved task
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Ubuntu 26.04 breaks drop-sudo socket ACL checks (openai/codex-action#188).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Recheck current task approval
        uses: actions/github-script@v8
        env:
          TASK_ID: ${{ needs.gate.outputs.task_id }}
          TASK_DIGEST: ${{ needs.gate.outputs.task_digest }}
          ENABLED: ${{ vars.CLINIC_MAP_AUTODEV_ENABLED }}
        with:
          script: |
            const {approvedTask} = require('./.github/scripts/autodev-task.cjs');
            const response = await github.rest.repos.getContent({...context.repo, path: '.github/autodev/tasks.json', ref: 'main'});
            if (response.data.encoding !== 'base64') throw new Error('Unexpected task file encoding');
            const task = approvedTask(JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8')));
            const digest = require('node:crypto').createHash('sha256').update(task?.instructions.trim() || '').digest('hex');
            if (process.env.ENABLED !== 'true' || task?.id !== process.env.TASK_ID || digest !== process.env.TASK_DIGEST) {
              throw new Error('Task approval changed after gate; refusing AI execution');
            }
      - name: Prepare single approved task
        env:
          APPROVED_TASK_ID: ${{ needs.gate.outputs.task_id }}
          APPROVED_DIGEST: ${{ needs.gate.outputs.task_digest }}
          ENABLED: ${{ vars.CLINIC_MAP_AUTODEV_ENABLED }}
          KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {approvedTask} = require('./.github/scripts/autodev-task.cjs');
          const task = approvedTask(JSON.parse(fs.readFileSync('.github/autodev/tasks.json', 'utf8')));
          const text = task?.instructions.trim() || '';
          const digest = require('node:crypto').createHash('sha256').update(text).digest('hex');
          if (!text || process.env.ENABLED !== 'true' || process.env.KEY_PRESENT !== 'true' ||
              task.id !== process.env.APPROVED_TASK_ID || digest !== process.env.APPROVED_DIGEST) {
            throw new Error('Task approval mismatch; refusing AI execution');
          }
          const policy = fs.readFileSync('.github/autodev/instructions.md', 'utf8');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/autodev-prompt.md',
            policy + '\n\nApproved task ID: ' + task.id + '\nImplement only this approved task:\n' + text + '\n');
          JS
      - name: Run Codex for approved task
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/autodev-prompt.md
          output-file: ${{ runner.temp }}/autodev-final.md
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          # Empty keeps the Action/Codex default; never select a model implicitly.
          model: ${{ vars.CLINIC_MAP_AUTODEV_MODEL }}
      # No privileged commands follow drop-sudo. All artifacts are untrusted proposals.
      - name: Collect patch without publishing code
        if: always() && steps.codex.outcome != 'skipped'
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          TASK_ID: ${{ needs.gate.outputs.task_id }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          git show "$BASE_SHA:.github/scripts/autodev-collect.py" > "$RUNNER_TEMP/autodev-collect.py"
          python3 "$RUNNER_TEMP/autodev-collect.py"
      - uses: actions/upload-artifact@v4
        if: always() && steps.codex.outcome != 'skipped'
        with:
          name: autodev-${{ needs.gate.outputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/autodev-result/
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate untrusted patch without secrets
    needs: [gate, develop]
    if: needs.develop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autodev-${{ needs.gate.outputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/autodev-input
      - name: Check proposal scope and apply locally
        env:
          PROPOSAL_DIR: ${{ runner.temp }}/autodev-input
        run: python3 .github/scripts/autodev-apply.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate proposal
        run: |
          mkdir -p "$RUNNER_TEMP/autodev-checks"
          set +e
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/autodev-checks/install.log" 2>&1
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "Installation failed ($install_status)" >> "$GITHUB_STEP_SUMMARY"
            exit "$install_status"
          fi
          node --test tests/*.test.cjs > "$RUNNER_TEMP/autodev-checks/tests.log" 2>&1
          test_status=$?
          npm run build > "$RUNNER_TEMP/autodev-checks/build.log" 2>&1
          build_status=$?
          ./node_modules/.bin/tsc --noEmit > "$RUNNER_TEMP/autodev-checks/types.log" 2>&1
          type_status=$?
          echo "Tests: $test_status; build: $build_status; types: $type_status" >> "$GITHUB_STEP_SUMMARY"
          test "$test_status" -eq 0 && test "$build_status" -eq 0 && test "$type_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autodev-checks-${{ needs.gate.outputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/autodev-checks/
          if-no-files-found: warn
          retention-days: 30
